# Banco descartável apenas para desenvolvimento local.
spring.datasource.url=jdbc:h2:mem:taskflow;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=false

# Conta fictícia disponível somente no H2 local do perfil dev.
taskflow.demo-admin.email=admin@taskflow.local
taskflow.demo-admin.password=TaskFlow-Demo-2026!
taskflow.jwt.secret=taskflow-local-development-signing-key-change-before-use
