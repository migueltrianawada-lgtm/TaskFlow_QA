name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run backend tests, Cucumber BDD and PostgreSQL Testcontainers
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=moderate

      - name: Generate BDD traceability report
        run: node scripts/report-bdd-coverage.mjs

      - name: Upload BDD coverage report
        uses: actions/upload-artifact@v4
        with:
          name: bdd-coverage-report
          path: docs/testes-bdd/relatorio-cobertura.md
